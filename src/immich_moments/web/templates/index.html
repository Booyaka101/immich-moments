<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>immich-moments</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1>immich&#8209;moments</h1>
  <form id="search" autocomplete="off">
    <input id="q" name="q" type="search" placeholder="blowing out candles" autofocus>
    <button type="submit">Search</button>
  </form>
  <div class="knob">
    <label for="weight">speech</label>
    <input id="weight" type="range" min="0" max="1" step="0.05" value="{{ stats.visual_weight }}">
    <label for="weight">vision</label>
    <span id="weight-value">{{ stats.visual_weight }}</span>
  </div>
  <p class="stats">
    {{ stats.scenes }} scenes across {{ stats.assets }} videos,
    {{ stats.segments }} transcript segments, {{ stats.people }} known faces.
    <span class="model">{{ stats.clip_model }}</span>
  </p>
</header>

<main>
  <p id="hint" class="note">Type what you remember. Scene vectors and the transcript are searched together.</p>
  <div id="results"></div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
