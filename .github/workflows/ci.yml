name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Every version the package metadata claims support for gets a cell.
        python: ["3.12", "3.13"]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install ffmpeg (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -m "not slow and not live" -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned: a ruff release that adds a rule must not turn a green branch red on its own.
      - run: pip install ruff==0.16.7
      - run: ruff check .
      - run: ruff format --check .

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: The sdist must carry the tests it claims to run
        run: |
          python - <<'PY'
          import glob, tarfile, sys
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = tarfile.open(sdist).getnames()
          required = [
              "tests/conftest.py",
              "tests/fixtures/speech.wav",
              "tests/fixtures/frame.jpg",
              "LICENSE",
              "README.md",
          ]
          missing = [r for r in required if not any(n.endswith("/" + r) for n in names)]
          if missing:
              sys.exit(f"{sdist} is missing {missing}")
          print(f"{sdist}: {len(names)} members, all required paths present")
          PY
      - name: The tests must pass from the sdist, not just from the checkout
        run: |
          mkdir -p /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist --strip-components=1
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          pip install "/tmp/sdist[dev]"
          cd /tmp/sdist && pytest -m "not slow and not live" -q
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/immich-moments --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: immich-moments:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm immich-moments:ci --version
