name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release
        required: true

permissions:
  contents: read

jobs:
  # A tag is only a release if the code under it is green, so the same checks run again here
  # rather than trusting that someone looked.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -m "not slow and not live" -q
      - name: The tag must match the version in the metadata
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          assert version == tag, f"pyproject says {version}, tag says {tag}"
          print(f"version {version} matches tag")
          PY

  pypi:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing, so no API token lives in the repo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-running a release must not fail on a file that is already up there.
          skip-existing: true

  ghcr:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Through the same action as the plain tags, because a registry rejects the owner's
      # capitalisation and github.repository carries it.
      - id: meta-cuda
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: suffix=-cuda
          tags: type=semver,pattern={{version}}
      - name: The GPU variant, same code with the CUDA wheels baked in
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: EXTRAS=cuda
          tags: ${{ steps.meta-cuda.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
