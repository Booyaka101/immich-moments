[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-moments"
version = "1.0.3"
description = "Make Immich home videos searchable by scene, face and speech, without forking Immich or touching its database."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Chris Bosch", email = "cbosch101@gmail.com" }]
keywords = ["immich", "video", "search", "clip", "whisper", "scene-detection", "face-recognition", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    # 0.7 folded opencv in as a hard dependency and dropped the [opencv] extra, which pip
    # warns about if you ask for it anyway.
    "scenedetect>=0.7",
    "faster-whisper>=1.0",
    "pillow>=10.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.3",
    "nvidia-cudnn-cu12>=9.0",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/Booyaka101/immich-moments"
Repository = "https://github.com/Booyaka101/immich-moments"
Issues = "https://github.com/Booyaka101/immich-moments/issues"
Changelog = "https://github.com/Booyaka101/immich-moments/blob/main/CHANGELOG.md"

[project.scripts]
immich-moments = "immich_moments.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
immich_moments = ["data/*.txt", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a model download or real inference",
    "live: needs a running Immich server and ML container (IMMICH_URL / IMMICH_ML_URL)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "S", "RUF"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "S101", "S311", "S603", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["immich_moments"]
known-local-folder = ["conftest"]
