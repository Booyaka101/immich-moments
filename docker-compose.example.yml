# Drop this next to your Immich stack: same folder as Immich's docker-compose.yml, same .env.
# It joins Immich's own compose network, so it reaches the server and the ML container by
# service name and nothing extra has to be published.
#
#   docker compose -f docker-compose.yml -f docker-compose.example.yml up -d immich-moments
#   docker compose -f docker-compose.yml -f docker-compose.example.yml run --rm immich-moments doctor
#   docker compose -f docker-compose.yml -f docker-compose.example.yml run --rm immich-moments index
#
# Add IMMICH_API_KEY=... to the .env Immich already reads. Make the key in Immich under
# Account Settings -> API Keys.

services:
  immich-moments:
    container_name: immich_moments
    image: ghcr.io/booyaka101/immich-moments:1.2.1
    environment:
      IMMICH_URL: http://immich-server:2283
      # Where your browser reaches Immich. IMMICH_URL above is a service name, which resolves
      # in here and nowhere a browser can follow, so without this every "Open in Immich" is dead.
      IMMICH_PUBLIC_URL: http://localhost:2283
      IMMICH_API_KEY: ${IMMICH_API_KEY}
      IMMICH_ML_URL: http://immich-machine-learning:3003
      # Whisper on the CPU is roughly five times slower than real time on a small model.
      # Use the cuda image and the deploy block below if you have an NVIDIA card.
      IMMICH_MOMENTS_WHISPER_MODEL: small
    volumes:
      - immich-moments-data:/data
    ports:
      # The UI has no auth, so it is published to this machine only. Widen it deliberately.
      - 127.0.0.1:8099:8099
    depends_on:
      - immich-server
      - immich-machine-learning
    restart: always

    # GPU transcription: use the -cuda image tag and uncomment.
    # image: ghcr.io/booyaka101/immich-moments:1.2.1-cuda
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  immich-moments-data:
